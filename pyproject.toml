[project]
name = "book-viewer"
version = "0.4.0"
description = "自炊本PDFリーダー（開き方を PDF に保存、ページの挿入・並べ替え、ファイル名検索、読書位置の記憶、更新を自動再読込）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pikepdf>=9",
    "pyside6>=6.6",
]

[project.scripts]
book-viewer = "book_viewer.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
]
