# Windows / macOS の配布用バイナリを作る。
#   手動実行（Actions タブの Run workflow）… 成果物（Artifacts）として zip を置く
#   タグ v* の push                         … さらに GitHub Release を作って zip を添付する
# PyInstaller はクロスコンパイルできないので、それぞれの OS のランナーで作る。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --group build

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv run --group build python packaging/build.py

      # 固めたバイナリを画面なしで起動し、PDF を開く・描く・開き方を書き込むまでを確かめる
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          BOOK_VIEWER_SELFTEST: ${{ runner.temp }}/selftest.txt
          QT_QPA_PLATFORM: offscreen
        run: |
          # Actions の bash は set -e なので、失敗しても結果ファイルを表示してから終わるようにする
          code=0
          "dist/Book Viewer.app/Contents/MacOS/Book Viewer" || code=$?
          cat "$BOOK_VIEWER_SELFTEST"; exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BOOK_VIEWER_SELFTEST: ${{ runner.temp }}\selftest.txt
          QT_QPA_PLATFORM: offscreen
        run: |
          # --windowed の exe はコンソールを持たないので、終了を待って終了コードを見る
          $p = Start-Process -FilePath "dist\Book Viewer.exe" -Wait -PassThru
          Get-Content $env:BOOK_VIEWER_SELFTEST
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: book-viewer-${{ runner.os }}
          path: |
            dist/book-viewer-*.zip
            dist/book-viewer-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
